# application-test.properties

# ==========================================
# Order Domain ? points at your ord_db container
# ==========================================
spring.datasource.order.url=jdbc:postgresql://localhost:5433/ord_db?currentSchema=public
spring.datasource.order.username=ord_user
spring.datasource.order.password=ord_user
spring.datasource.order.driver-class-name=org.postgresql.Driver

# ==========================================
# Inventory Domain ? points at your scm_db container
# ==========================================
spring.datasource.inventory.url=jdbc:postgresql://localhost:5434/scm_db?currentSchema=public
spring.datasource.inventory.username=scm_user
spring.datasource.inventory.password=scm_user
spring.datasource.inventory.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA ? real PostgreSQL, validate existing schema
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ==========================================
# Kafka ? mock it, don't need real Kafka for unit tests
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092

# ==========================================
# Misc
# ==========================================
spring.main.allow-bean-definition-overriding=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jooq.JooqAutoConfiguration
spring.threads.virtual.enabled=false